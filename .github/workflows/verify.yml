name: verify

# The suite is the project's main claim: the palettes are solved rather than
# chosen, and the client bundle is generated rather than hand-edited. Running it
# on every push is what keeps that claim true.
#
# DSH itself is not installable in CI, and a few checks resolve DSH's own
# packages (the theme stylesheet for token polarity, the peer dependencies for
# the Host half). Those are skipped when no installation is present; everything
# else runs. See `tools/dsh_paths.py`.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The generated files are compared byte for byte against a rebuild, so the
      # checkout must not rewrite line endings. `.gitattributes` already pins
      # `eol=lf`, and this makes the intent explicit rather than implicit.
      - name: Check out with LF endings
        run: |
          git config core.autocrlf false
          git config core.eol lf

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip numpy pillow

      - name: Check the manifest and the bundle syntax
        run: |
          node --check client.js
          node --check index.js
          node --check api.js
          node --check store.js
          node --check theme-data.js
          node --check tools/peer-resolver.mjs
          node -e "const m=require('./package.json'); if(!m.dsh?.bundle?.patch) throw new Error('no dsh.bundle.patch'); if(!m.dsh?.client) throw new Error('no dsh.client'); console.log('manifest ok')"

      - name: Rebuild the palettes from the source images
        # The load-bearing step: it proves the committed `client.js` and
        # `theme-data.js` really are the generator's output for these images,
        # rather than something edited by hand afterwards.
        run: python tools/build_palettes.py

      - name: The rebuild must not change a committed file
        run: |
          if ! git diff --exit-code -- client.js theme-data.js tools/palette.json; then
            echo "::error::The committed generated files do not match a rebuild. Run 'python tools/build_palettes.py' and commit the result."
            exit 1
          fi

      - name: Solver parity and the inlined solver
        run: |
          node tools/verify-solver.mjs
          node tools/verify-inlined.mjs

      - name: Bundle verification
        run: python tools/verify.py

      - name: Manifest compatibility ranges
        run: python tools/verify-compat.py
