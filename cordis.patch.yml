# Companion patch for the 画廊 Gallery theme bundle.
#
# This is what makes the package self-installing: the plugin manager reads
# `dsh.bundle.patch` from package.json and mounts this row, instead of the
# profile's own cordis.patch.yml being hand-edited — a file the Settings UI
# owns and rewrites from its own view of the configuration.
#
# A row must arrive through `insert`. An entry carrying only id+name is an
# override aimed at a row that already exists; with no matching row the include
# drops it with a warning rather than creating it, so the plugin would never
# mount and the boot would still succeed.
- insert:
    - id: theme-gallery
      name: "dsh-theme-gallery"
